[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = platformio/espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@1.1.2

[env:native]
platform = native
build_flags = -Wall -Wextra
test_build_src = no
