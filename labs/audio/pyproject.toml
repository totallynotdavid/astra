[project]
name = "astra-audio"
version = "0.1.0"
description = "Speaking-pattern analysis lab for ASTRA"
requires-python = ">=3.14,<3.15"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
transcribe = [
    "faster-whisper>=1.2,<2",
    "av>=16,<19",
    "sounddevice>=0.5,<1",
]
diarize = [
    "pyannote.audio>=4.0,<5",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]

[project.scripts]
astra-audio = "astra_audio.__main__:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
exclude = ["src/astra_audio/server_contract.py"]

[[tool.mypy.overrides]]
module = "astra_audio.server_contract"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["faster_whisper", "pyannote.*", "sounddevice", "torch"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
