[tools]
bun = "1.4.4"
python = "3.15.2"
uv = "0.13.7"

[tasks.install]
description = "Install the server, vision lab and web dependencies from lockfiles"
run = [
  "bun install --frozen-lockfile",
  "uv sync --locked --project server",
  "uv sync --locked --project labs/vision --python 3.14",
]

[tasks.dev]
description = "Run the server and the web app with reload"
depends = ["dev:server", "dev:web"]

[tasks."dev:server"]
description = "Run the API on 127.0.0.1:8000"
dir = "server"
run = "uv run uvicorn astra.app:create_app --factory --reload --host 127.0.0.1 --port 8000"

[tasks."dev:web"]
description = "Run the web app with a proxy to the API"
run = "bun run --cwd web dev"

[tasks.demo]
description = "Build the web app and serve it with the API on 127.0.0.1:8000"
run = [
  "bun run --cwd web build",
  "cd server && ASTRA_WEB_DIST=../web/dist uv run uvicorn astra.app:create_app --factory --host 127.0.0.1 --port 8000",
]

[tasks.generate]
description = "Regenerate contract/openapi.json and the web types from the Pydantic models"
run = [
  "cd server && uv run python -m astra.openapi > ../contract/openapi.json",
  "bun run --cwd tools/contract generate",
  "bunx oxfmt web/src/contract/api.ts",
]

[tasks."lint:contract"]
description = "Fail when the generated contract files differ from the models"
run = "scripts/check-contract"

[tasks.lint]
description = "Run every read-only linter and formatter check"
depends = ["lint:*"]

[tasks."lint:python"]
dir = "server"
run = ["uv run ruff check --no-fix .", "uv run ruff format --check ."]

[tasks."lint:vision"]
dir = "labs/vision"
run = ["uv run --python 3.14 ruff check .", "uv run --python 3.14 ruff format --check ."]

[tasks."lint:web"]
run = ["bun run --cwd web lint", "bunx oxfmt --check web/src web/vite.config.ts"]

[tasks.fix]
description = "Apply safe lint fixes and format source files"
run = [
  "cd server && uv run ruff check --fix . && uv run ruff format .",
  "cd labs/vision && uv run --python 3.14 ruff check --fix . && uv run --python 3.14 ruff format .",
  "bunx oxfmt web/src web/vite.config.ts",
]

[tasks.typecheck]
description = "Typecheck the server, vision lab and web app"
run = [
  "cd server && uv run mypy",
  "cd labs/vision && uv run --python 3.14 mypy",
  "bun run --cwd web typecheck",
]

[tasks.test]
description = "Run the server, vision lab and web test suites"
run = [
  "cd server && uv run pytest -q",
  "cd labs/vision && uv run --python 3.14 pytest -q",
  "bun run --cwd web test",
]

[tasks."lab:vision"]
description = "Run the ASTRA vision lab"
dir = "labs/vision"
run = "uv run --python 3.14 python -m astra_vision"

[tasks."lab:vision:generate-contract"]
description = "Generate vision lab payload models from the server OpenAPI contract"
dir = "labs/vision"
run = [
  "uvx --python 3.14 --from datamodel-code-generator==0.93.0 datamodel-codegen --input ../../contract/openapi.json --input-file-type openapi --output src/astra_vision/server_contract.py --output-model-type pydantic_v2.BaseModel --target-python-version 3.14 --disable-timestamp --formatters builtin",
  "uv run --python 3.14 ruff format src/astra_vision/server_contract.py",
]

[tasks.build]
description = "Build the web app into web/dist"
run = "bun run --cwd web build"

[tasks.site]
description = "Export the sessions and build the static demo into web/dist-site"
run = ["cd server && uv run python -m astra.export", "bun run --cwd web build:site"]

[tasks.check]
description = "Run every repository check without writing files"
run = ["mise run lint", "mise run typecheck", "mise run test", "mise run build", "mise run site"]
